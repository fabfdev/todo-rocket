name: CI/CD

on:
    push:
        branches:
            - master

jobs:
    CI:
        name: Continuous Integration
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                node-version: 22.x

            - name: Install Dependencies
              run: npm install
    
    CD:
        name: Continuous Delivery
        runs-on: ubuntu-latest

        needs: CI

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Setup node
              uses: actions/setup-node@v3
              with:
                node-version: 22.x

            - name: Setup EAS DFAppHub
              uses: expo/expo-github-action@v8
              with:
                eas-version: latest
                package: npm
                token: ${{ secrets.EAS_EXPO_TOKEN_DFAPPHUB }}